<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVORA - Choose Your Focus</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0b0f12;
            background: radial-gradient(circle at center, #11171a 0%, #07090b 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 900px;
            padding: 20px;
            text-align: center;
        }

        .brand-logo {
            font-family: 'Playfair Display', 'Didot', 'Georgia', serif;
            font-size: 2.5rem;
            letter-spacing: 0.5rem;
            color: #cbb3a3;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 0.75rem;
            letter-spacing: 0.3rem;
            color: #888888;
            text-transform: uppercase;
            margin-bottom: 50px;
        }

        .selection-grid {
            display: flex;
            gap: 30px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .category-card {
            background-color: #0d1216;
            border: 1px solid #1a2329;
            width: 320px;
            height: 400px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.4s ease;
            text-decoration: none;
            position: relative;
        }

        .category-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 1px;
            background-color: #cbb3a3;
            transition: all 0.4s ease;
        }

        .category-card:hover {
            border-color: #cbb3a3;
            background-color: #11171c;
            transform: translateY(-5px);
        }

        .category-card:hover::after {
            width: 80%;
            left: 10%;
        }

        .card-icon {
            font-size: 2.5rem;
            color: #888888;
            margin-bottom: 20px;
            font-weight: 300;
            transition: color 0.4s ease;
        }

        .category-card:hover .card-icon {
            color: #cbb3a3;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            letter-spacing: 0.15rem;
            color: #ffffff;
            margin-bottom: 15px;
            font-weight: 400;
        }

        .card-desc {
            font-size: 0.7rem;
            letter-spacing: 0.15rem;
            color: #666666;
            text-transform: uppercase;
            max-width: 80%;
            line-height: 1.6;
            transition: color 0.4s ease;
        }

        .category-card:hover .card-desc {
            color: #aaaaaa;
        }


        @media (max-width: 768px) {
            .selection-grid {
                flex-direction: column;
                align-items: center;
            }
            .category-card {
                width: 100%;
                max-width: 340px;
                height: 250px;
            }
            body {
                height: auto;
                padding: 40px 0;
                overflow: auto;
            }
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400&family=Playfair+Display:wght@400&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <div class="brand-logo">Evora</div>
        <div class="subtitle">What can we help you with?</div>

        <div class="selection-grid">
            <a href="{%url 'skincare-dashboard' %}" class="category-card">
                <div class="card-icon"><img src="https://th.bing.com/th/id/OIP.sIv2b0x6XSnMRkygFAkCRAHaFj?r=0&o=7rm=3&rs=1&pid=ImgDetMain&o=7&rm=3" width="200px" height="200px"></div>
                <div class="card-title">Skincare</div>
                <div class="card-desc">Your Skin. Your Glow. Explore personalized treatments.</div>
            </a>

            <a href="{% url 'haircare-dashboard' %}" class="category-card">
                <div class="card-icon"><img src="https://img.freepik.com/free-photo/hairdressing-supplies-bottle-with-spray-pump_23-2147711586.jpg?semt=ais_hybrid" width="200px" height="200px"></div>
                <div class="card-title">Haircare</div>
                <div class="card-desc">Your Hair. Your Strength. Discover nourishing routines.</div>
            </a>
        </div>
    </div>

</body>
</html>
