<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EVORA - Registration Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        /* Core Layout Reset */
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1412; /* Matches the main page dark-slate foundation */
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        * {
            box-sizing: border-box;
        }

        /* Full Screen Form Container Background Overlay */
        .form-overlay-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
            background: radial-gradient(circle, rgba(13, 24, 21, 0.5) 0%, rgba(10, 14, 22, 0.9) 100__);
            overflow-y: auto;
        }

        /* Minimal Luxury Form Card */
        form {
            width: 100%;
            max-width: 480px;
            background: rgba(13, 20, 18, 0.4);
            border: 1px solid rgba(229, 193, 179, 0.15); /* Soft rose-gold hint frame */
            padding: 45px 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px); /* Smooth background glassmorphism filter */
            animation: formEntrance 1.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Side-by-Side Flex Layout Row */
        .row {
            display: flex;
            gap: 20px;
            width: 100%;
        }

        .row .input-group {
            flex: 1;
        }

        /* Field Alignment Block Groupings */
        .input-group {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 6px;
        }

        .input-group label {
            font-size: 0.75rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            color: #a3b8b0; /* Fresh Muted Sage Accent */
        }

        .required {
            color: #e5c1b3; /* Premium Soft Rose Gold Accent */
            margin-left: 2px;
        }

        /* Input Fields Baseline Restyling */
        .input-group input {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(163, 184, 176, 0.3);
            padding: 8px 0;
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.95rem;
            font-weight: 300;
            outline: none;
            transition: border-bottom-color 0.4s ease;
        }

        /* Standard Calendar Scheme Fix */
        .input-group input[type="date"] {
            color-scheme: dark;
        }

        /* Input Interactive Focus Highlight Action */
        .input-group input:focus {
            border-bottom-color: #e5c1b3; /* Glow border to rose gold */
        }

        /* Radio Gender Controls Panel */
        .gender {
            display: flex;
            justify-content: flex-start;
            gap: 24px;
            margin-top: 6px;
            width: 100%;
        }

        .gender label {
            font-size: 0.85rem;
            font-weight: 300;
            color: #a3b8b0;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .gender input[type="radio"] {
            accent-color: #e5c1b3; /* Colors the center inner dot with rose-gold natively */
            cursor: pointer;
        }

        .gender label:hover {
            color: #ffffff;
        }

        /* Action Form Submission Button Styling */
        .submit-btn {
            width: 100%;
            background-color: transparent;
            border: 1px solid #e5c1b3;
            padding: 14px 0;
            color: #e5c1b3;
            font-family: 'Montserrat', sans-serif;
            font-size: 0.85rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 3px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.4s ease, color 0.4s ease, box-shadow 0.4s ease, transform 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #e5c1b3;
            color: #0d1412;
            box-shadow: 0 10px 30px rgba(229, 193, 179, 0.2);
        }

        .submit-btn:active {
            transform: scale(0.99);
        }

        /* Smooth Card Fade Entrance */
        @keyframes formEntrance {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Mobile Breakdowns */
        @media (max-width: 480px) {
            form {
                padding: 30px 20px;
            }
            .row {
                flex-direction: column;
                gap: 24px;
            }
        }

        .login-redirect {
            display: block;
            width: 100%;
            text-align: center;
            font-size: 0.85rem;
            font-weight: 300;
            letter-spacing: 0.5px;
            margin-top: 20px;
            margin-bottom:0;
            color: #a3b8b0;
            font-family:'Montserrat',sans-serif;
        }

        .login-redirect a {
            color: #e5c1b3; /* Your rose-gold color */
            text-decoration: none;
            font-weight: 500;
            margin-left: 6px;
            position: relative;
            transition: color 0.3s ease;
            display:inline-block;
        }

        /* This controls the small line that appears under "Login" when you hover over it */
        .login-redirect a::after {
            content: '';
            position: absolute;
            width: 100%;
            transform: scaleX(0);
            height: 1px;
            bottom: -2px;
            left: 0;
            background-color: #e5c1b3; /* Match your hover line color preference */
            transform-origin: bottom right;
            transition: transform 0.3s ease-out;
        }

        .login-redirect a:hover {
            color: #ffffff;
        }

        .login-redirect a:hover::after {
            transform: scaleX(1);
            transform-origin: bottom left;
        }
    </style>
</head>
<body>

<div class="form-overlay-container">
    <form action="" method="POST">
        {% csrf_token %}

        {% if messages %}
            {% for message in messages %}
                <p style="color: #ff4d4d; font-size: 13px; margin: 0; text-align: center;">{{ message }}</p>
            {% endfor %}
        {% endif %}

        <div class="row">
            <div class="input-group">
                <label>First Name <span class="required">*</span></label>
                <input type="text" name="first_name" required>
            </div>

            <div class="input-group">
                <label>Last Name <span class="required">*</span></label>
                <input type="text" name="last_name" required>
            </div>
        </div>

        <div class="input-group">
            <label>Email <span class="required">*</span></label>
            <input type="email" name="email" required>
        </div>

        <div class="input-group">
            <label>Create Password<span class="required">*</span></label>
            <input type="password" name="password" required>
        </div>

        <div class="input-group" id="confirmPasswordContainer">
            <label>Confirm Password <span class="required">*</span></label>
            <input type="password" id="confirmPassword" name="confirm_password" required placeholder=" ">
            <p id="passwordErrorMsg" style="color: #ff4d4d; font-size: 12px; margin-top: 5px; display: none;">password does not match</p>
        </div>

        <div class="input-group">
            <label>Birth Date <span class="required">*</span></label>
            <input type="date" name="birth_date" required>
        </div>

        <div class="gender">
            <label><input type="radio" name="gender" value="Female"> Female</label>
            <label><input type="radio" name="gender" value="Male"> Male</label>
            <label><input type="radio" name="gender" value="Non-Binary"> Non-Binary</label>
        </div>

        <button class="submit-btn" type="submit">
            Register
        </button>

        <p class="login-redirect">
            Already have an account?<a href="{% url 'login' %}">Login</a>
        </p>
    </form>
</div>

<script>
    const confirmPasswordInput = document.getElementById('confirmPassword');
    const createPasswordInput = document.querySelector('input[type="password"]:not(#confirmPassword)');
    const errorText = document.getElementById('passwordErrorMsg');

    function checkPasswords() {
        const passValue = createPasswordInput.value;
        const confirmValue = confirmPasswordInput.value;

        if (confirmValue === "") {
            errorText.style.display = 'none';
            confirmPasswordInput.setCustomValidity('');
            return;
        }

        if (passValue !== confirmValue) {
            errorText.style.display = 'block';
            confirmPasswordInput.setCustomValidity('password does not match');
        } else {
            errorText.style.display = 'none';
            confirmPasswordInput.setCustomValidity('');
        }
    }

    confirmPasswordInput.addEventListener('input', checkPasswords);
    createPasswordInput.addEventListener('input', checkPasswords);
</script>

</body>
</html>
